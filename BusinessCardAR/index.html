<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Business Card</title>
    <style>
        body { margin: 0; overflow: hidden; background: transparent; }
        canvas { display: block; }
    </style>

    <!--MindAr Script -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
</head>
<body>

<div id="links" style="
    display: none;
    position: absolute;
    top: 20px;
    right: 50px;
    z-index: 10;
    flex-direction: column;
    gap: 10px;
"></div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const AR_MODE = true;

    // ── VARIABLES ────────────────────────────────────────────────
    let scene, camera, renderer;
    let planet, planetColombia,planetFrance, satellite, logo;
    let pieChartGroup, pieChartMesh;
    let waveSphere, fresnelPulseSphere;
    let linkButton, leyenda;
    let labelMeshes = [];

    let planetMaterial, hologramMaterial, fresnelPulseMaterial;
    let colombiaMaterial, franceMaterial, pieChartMaterial;

    let autorotate   = true;
    let isDragging   = false;
    let pointerMoved = false;
    let prev         = new THREE.Vector2();

    const loader    = new GLTFLoader();
    const texLoader = new THREE.TextureLoader();
    const clock     = new THREE.Clock();

    // ── BAR LABELS — change text per bar independently ───────────
    // Index matches uBarColor0..uBarColor13 exactly.
    const BAR_LABELS = [
        'Python',      // 0
        'Pandas',    // 1
        'Javascript',         // 2
        'AWS',       // 3
        'Node.js',       // 4
        'GCP',       // 5
        'Power BI',    // 6
        'Claude',     // 7
        'HTML',     // 8
        'CSS',     // 9
        'MYSQL',     // 10
        'Three.js',   // 11
        'Numpy',      // 12
        'Git',      // 13
    ];

    // ── PLANET SHADER ────────────────────────────────────────────
    planetMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime:            { value: 0.0 },
            uTexture:         { value: texLoader.load('Textures/_Transparency_White.png') },
            uGlowColor:       { value: new THREE.Color(0x00aaff) },
            uTexColor:        { value: new THREE.Color(0xd0e0e3) },
            uFresnelPower:    { value: 1.7 },
            uFresnelStrength: { value: 1.5 },
        },
        vertexShader: `
            varying vec2 vUv;
            varying vec3 vNormalView;
            varying vec3 vPositionView;
            void main() {
                vUv           = uv;
                vNormalView   = normalize(normalMatrix * normal);
                vec4 viewPos  = modelViewMatrix * vec4(position, 1.0);
                vPositionView = viewPos.xyz;
                gl_Position   = projectionMatrix * viewPos;
            }
        `,
        fragmentShader: `
            uniform float     uTime;
            uniform sampler2D uTexture;
            uniform vec3      uGlowColor;
            uniform vec3      uTexColor;
            uniform float     uFresnelPower;
            uniform float     uFresnelStrength;
            varying vec2 vUv;
            varying vec3 vNormalView;
            varying vec3 vPositionView;
            void main() {
                vec4  texColor = texture2D(uTexture, vUv);
                vec3  viewDir  = normalize(-vPositionView);
                float facing   = dot(vNormalView, viewDir);
                float fresnel  = pow(1.0 - facing, uFresnelPower);
                float scanLine = sin(vUv.y * 50.0 + uTime * 2.0) * 0.04;
                float mask     = smoothstep(0.2, 0.8, texColor.a);
                vec3  baseColor  = uTexColor * mask;
                vec3  finalColor = baseColor + (uGlowColor * fresnel * uFresnelStrength) + scanLine;
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `
    });

    // ── COLOMBIA PLANET SHADER ───────────────────────────────────
    // FIX 1: added transparent:true + depthWrite:false so the texture alpha works.
    // FIX 2: fragment now outputs mask as alpha so transparent PNG areas disappear.
    // FIX 3: animate() was doing *= instead of = (fixed below).
    colombiaMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime:    { value: 0.0 },
            uTexture: { value: texLoader.load('Textures/Colombia.png') },
            uTexColor:{ value: new THREE.Color(0xfbbd00) },
        },
        transparent: true,      // ← FIX 1
        depthWrite:  false,      // ← FIX 1
        side: THREE.DoubleSide,
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv         = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform sampler2D uTexture;
            uniform vec3      uTexColor;
            varying vec2 vUv;
            void main() {
                vec4  texColor = texture2D(uTexture, vUv);
                float mask     = smoothstep(0.2, 0.8, texColor.a);
                vec3  baseColor = uTexColor * mask;
                gl_FragColor = vec4(baseColor, mask); // ← FIX 2: alpha = mask, not 1.0
            }
        `
    });

    franceMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime:    { value: 0.0 },
            uTexture: { value: texLoader.load('Textures/France.png') },
            uTexColor:{ value: new THREE.Color(0xff007d) },
        },
        transparent: true,      // ← FIX 1
        depthWrite:  false,      // ← FIX 1
        side: THREE.DoubleSide,
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv         = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform sampler2D uTexture;
            uniform vec3      uTexColor;
            varying vec2 vUv;
            void main() {
                vec4  texColor = texture2D(uTexture, vUv);
                float mask     = smoothstep(0.2, 0.8, texColor.a);
                vec3  baseColor = uTexColor * mask;
                gl_FragColor = vec4(baseColor, mask); // ← FIX 2: alpha = mask, not 1.0
            }
        `
    });

    // ── HOLOGRAM SHADER ──────────────────────────────────────────
    hologramMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime:       { value: 0.0 },
            uColor:      { value: new THREE.Color(0x00ffcc) },
            uLineFreq:   { value: 300.0 },
            uLineSpeed:  { value: -5 },
            uGridFreq:   { value: 20 },
            uBrightness: { value: 0.2 },
        },
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
        vertexShader: `
            varying vec2 vUv;
            varying vec3 vNormalView;
            varying vec3 vPositionView;
            void main() {
                vUv           = uv;
                vNormalView   = normalize(normalMatrix * normal);
                vec4 viewPos  = modelViewMatrix * vec4(position, 1.0);
                vPositionView = viewPos.xyz;
                gl_Position   = projectionMatrix * viewPos;
            }
        `,
        fragmentShader: `
            uniform float uTime;
            uniform vec3  uColor;
            uniform float uLineFreq;
            uniform float uLineSpeed;
            uniform float uGridFreq;
            uniform float uBrightness;
            varying vec2 vUv;
            varying vec3 vNormalView;
            varying vec3 vPositionView;
            void main() {
                float lines   = smoothstep(0.4, 0.6,
                    sin(vUv.y * uLineFreq - uTime * uLineSpeed) * 0.5 + 0.5);
                float gridH   = sin(vUv.y * uGridFreq) * 0.5 + 0.5;
                float gridV   = sin(vUv.x * uGridFreq) * 0.5 + 0.5;
                float grid    = gridH * gridV * 0.15;
                vec3  viewDir = normalize(-vPositionView);
                float fresnel = pow(1.0 - dot(vNormalView, viewDir), 2.0);
                float brightness = (lines + grid) * uBrightness;
                float alpha      = clamp(lines * 0.7 + 0.1 + fresnel * 0.4, 0.0, 1.0);
                gl_FragColor = vec4(uColor * brightness, alpha);
            }
        `
    });

    // ── FRESNEL PULSE SHADER ─────────────────────────────────────
    // NOTE: removed the duplicate declaration that was in the original file.
    fresnelPulseMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime:          { value: 0.0 },
            uGlowColor:     { value: new THREE.Color(0xd9ead3) },
            uPulseColor:    { value: new THREE.Color(0xAAFF26) },
            uFresnelPower:  { value: 2.0 },
            uPulseSpeed:    { value: 1.5 },
            uPulseWidth:    { value: 1.0 },
            uGlowStrength:  { value: 0.2 },
            uPulseStrength: { value: 1.2 },
        },
        transparent: true,
        side:        THREE.FrontSide,
        depthWrite:  false,
        blending:    THREE.AdditiveBlending,
        vertexShader: `
            varying vec3 vNormalView;
            varying vec3 vPositionView;
            void main() {
                vNormalView   = normalize(normalMatrix * normal);
                vec4 viewPos  = modelViewMatrix * vec4(position, 1.0);
                vPositionView = viewPos.xyz;
                gl_Position   = projectionMatrix * viewPos;
            }
        `,
        fragmentShader: `
            uniform float uTime;
            uniform vec3  uGlowColor;
            uniform vec3  uPulseColor;
            uniform float uFresnelPower;
            uniform float uPulseSpeed;
            uniform float uPulseWidth;
            uniform float uGlowStrength;
            uniform float uPulseStrength;
            varying vec3 vNormalView;
            varying vec3 vPositionView;
            void main() {
                vec3  viewDir    = normalize(-vPositionView);
                float facing     = dot(vNormalView, viewDir);
                float fresnel    = pow(1.0 - facing, uFresnelPower);
                float pulsePhase = mod(uTime * uPulseSpeed, 1.0);
                float pulseDist  = abs(fresnel - (1.0 - pulsePhase));
                float pulse      = (1.0 - smoothstep(0.0, uPulseWidth, pulseDist))
                                 * (1.0 - pulsePhase);
                vec3  col   = uGlowColor * fresnel * uGlowStrength
                            + uPulseColor * pulse * uPulseStrength;
                float alpha = clamp(fresnel * uGlowStrength + pulse * 0.8, 0.0, 1.0);
                gl_FragColor = vec4(col, alpha);
            }
        `
    });

    // ── PIE CHART SHADER ─────────────────────────────────────────
    pieChartMaterial = new THREE.ShaderMaterial({
        uniforms: {
            uTime:        { value: 0.0 },
            uNumBars:     { value: 14 },
            uInnerRadius: { value: 0.6 },
            uOuterRadius: { value: 1.0 },
            uGapAngle:    { value: 0.02 },

            uBarLength0:  { value: 1.00 }, uBarLength1:  { value: 0.60 },
            uBarLength2:  { value: 0.85 }, uBarLength3:  { value: 0.70 },
            uBarLength4:  { value: 0.75 }, uBarLength5:  { value: 0.60 },
            uBarLength6:  { value: 0.90 }, uBarLength7:  { value: 0.70 },
            uBarLength8:  { value: 0.75 }, uBarLength9:  { value: 0.60 },
            uBarLength10: { value: 0.90 }, uBarLength11: { value: 0.70 },
            uBarLength12: { value: 0.75 }, uBarLength13: { value: 0.60 },

            uBarColor0:  { value: new THREE.Color(0x00aaff) },
            uBarColor1:  { value: new THREE.Color(0xAAFF26) },
            uBarColor2:  { value: new THREE.Color(0x00ffcc) },
            uBarColor3:  { value: new THREE.Color(0x7dbf65) },
            uBarColor4:  { value: new THREE.Color(0x00aaff) },
            uBarColor5:  { value: new THREE.Color(0xAAFF26) },
            uBarColor6:  { value: new THREE.Color(0x00ffcc) },
            uBarColor7:  { value: new THREE.Color(0x7dbf65) },
            uBarColor8:  { value: new THREE.Color(0x00aaff) },
            uBarColor9:  { value: new THREE.Color(0xAAFF26) },
            uBarColor10: { value: new THREE.Color(0x00ffcc) },
            uBarColor11: { value: new THREE.Color(0x7dbf65) },
            uBarColor12: { value: new THREE.Color(0x00aaff) },
            uBarColor13: { value: new THREE.Color(0xAAFF26) },

            uRotationSpeed: { value: 0.05 },
            uScanSpeed:     { value: 0.8  },
            uGlowStrength:  { value: 1.2  },
        },
        transparent: true,
        side:        THREE.DoubleSide,
        depthWrite:  false,
        blending:    THREE.AdditiveBlending,
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv         = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uTime;
            uniform int   uNumBars;
            uniform float uInnerRadius;
            uniform float uOuterRadius;
            uniform float uGapAngle;

            uniform float uBarLength0;  uniform float uBarLength1;
            uniform float uBarLength2;  uniform float uBarLength3;
            uniform float uBarLength4;  uniform float uBarLength5;
            uniform float uBarLength6;  uniform float uBarLength7;
            uniform float uBarLength8;  uniform float uBarLength9;
            uniform float uBarLength10; uniform float uBarLength11;
            uniform float uBarLength12; uniform float uBarLength13;

            uniform vec3 uBarColor0;  uniform vec3 uBarColor1;
            uniform vec3 uBarColor2;  uniform vec3 uBarColor3;
            uniform vec3 uBarColor4;  uniform vec3 uBarColor5;
            uniform vec3 uBarColor6;  uniform vec3 uBarColor7;
            uniform vec3 uBarColor8;  uniform vec3 uBarColor9;
            uniform vec3 uBarColor10; uniform vec3 uBarColor11;
            uniform vec3 uBarColor12; uniform vec3 uBarColor13;

            uniform float uRotationSpeed;
            uniform float uScanSpeed;
            uniform float uGlowStrength;

            varying vec2 vUv;

            float getLength(int i) {
                if (i == 0)  return uBarLength0;  if (i == 1)  return uBarLength1;
                if (i == 2)  return uBarLength2;  if (i == 3)  return uBarLength3;
                if (i == 4)  return uBarLength4;  if (i == 5)  return uBarLength5;
                if (i == 6)  return uBarLength6;  if (i == 7)  return uBarLength7;
                if (i == 8)  return uBarLength8;  if (i == 9)  return uBarLength9;
                if (i == 10) return uBarLength10; if (i == 11) return uBarLength11;
                if (i == 12) return uBarLength12; return uBarLength13;
            }
            vec3 getColor(int i) {
                if (i == 0)  return uBarColor0;  if (i == 1)  return uBarColor1;
                if (i == 2)  return uBarColor2;  if (i == 3)  return uBarColor3;
                if (i == 4)  return uBarColor4;  if (i == 5)  return uBarColor5;
                if (i == 6)  return uBarColor6;  if (i == 7)  return uBarColor7;
                if (i == 8)  return uBarColor8;  if (i == 9)  return uBarColor9;
                if (i == 10) return uBarColor10; if (i == 11) return uBarColor11;
                if (i == 12) return uBarColor12; return uBarColor13;
            }

            void main() {
                vec2  p      = vUv * 2.0 - 1.0;
                float r      = length(p);
                float TWO_PI = 6.28318530718;

                if (r < uInnerRadius) discard;
                if (r > uOuterRadius) discard;

                float theta = atan(p.y, p.x) - uTime * uRotationSpeed;
                theta = mod(theta + TWO_PI, TWO_PI);

                float n          = float(uNumBars);
                float sliceAngle = TWO_PI / n;
                float barAngle   = sliceAngle - uGapAngle;
                if (barAngle <= 0.0) discard;

                float sliceF     = theta / sliceAngle;
                int   idx        = int(sliceF);
                float localTheta = (sliceF - float(idx)) * sliceAngle;

                if (localTheta > barAngle) discard;

                float barLen   = getLength(idx);
                float barOuter = uInnerRadius + (uOuterRadius - uInnerRadius) * barLen;
                if (r > barOuter) discard;

                vec3  col      = getColor(idx);
                float radialT  = (r - uInnerRadius) / (barOuter - uInnerRadius);
                float angularT = localTheta / barAngle;

                float scan      = smoothstep(0.35, 0.65,
                    sin(r * 2.0 - uTime * uScanSpeed) * 0.5 + 0.5) * 0.25;
                float pulse     = sin(uTime * 1.8 + float(idx) * 0.9) * 0.12 + 0.88;
                float innerGlow = 1.0 - smoothstep(0.0, 0.3, radialT);
                float tipFade   = 1.0 - smoothstep(0.80, 1.0, radialT);
                float AA        = 0.015;
                float edgeFade  = smoothstep(0.0, AA, angularT)
                                * smoothstep(0.0, AA, 1.0 - angularT);

                float brightness = (0.55 + scan + innerGlow * 0.5)
                                 * tipFade * edgeFade * pulse * uGlowStrength;
                float alpha      = brightness * (1.0 - radialT * 0.3);
                gl_FragColor = vec4(col * brightness, clamp(alpha, 0.0, 1.0));
            }
        `
    });

    // ── RAYCASTER ────────────────────────────────────────────────
    const raycaster = new THREE.Raycaster();
    const mouse     = new THREE.Vector2();

    function getMouse(e, el) {
        const r = el.getBoundingClientRect();
        return {
            x:  ((e.clientX - r.left) / r.width)  * 2 - 1,
            y: -((e.clientY - r.top)  / r.height) * 2 + 1,
        };
    }

    function attachPointerEvents(el) {
        el.addEventListener('pointerdown', (e) => {
            pointerMoved = false;
            const p = getMouse(e, el);
            mouse.set(p.x, p.y);
            raycaster.setFromCamera(mouse, camera);
            if (raycaster.intersectObject(planet, true).length > 0) {
                isDragging = true;
                prev.set(e.clientX, e.clientY);
            }
        });
        el.addEventListener('pointermove', (e) => {
            pointerMoved = true;
            if (!isDragging) return;
            planet.rotation.y += (e.clientX - prev.x) * 0.005;
            planet.rotation.x += (e.clientY - prev.y) * 0.005;
            planet.rotation.x = THREE.MathUtils.clamp(planet.rotation.x, -1.2, 1.2);
            prev.set(e.clientX, e.clientY);
        });
        el.addEventListener('pointerup', (e) => {
            isDragging = false;
            if (!pointerMoved && linkButton) {
                const p = getMouse(e, el);
                mouse.set(p.x, p.y);
                raycaster.setFromCamera(mouse, camera);
                if (raycaster.intersectObject(linkButton, true).length > 0) {
                    window.open('https://javierladino.com', '_blank');
                }
            }
        });
    }

    // ── MODE SETUP ───────────────────────────────────────────────
    if (AR_MODE) {

        const mindarThree = new window.MINDAR.IMAGE.MindARThree({
            container: document.body,
            imageTargetSrc: 'targets.mind',
        });
        scene    = mindarThree.scene;
        camera   = mindarThree.camera;
        renderer = mindarThree.renderer;

        const anchor = mindarThree.addAnchor(0);
        anchor.onTargetFound = () => { document.getElementById('links').style.display = 'flex'; };
        anchor.onTargetLost  = () => { document.getElementById('links').style.display = 'none';  };

        loadObjects(anchor.group);
        colombiaPlanetContainer(anchor.group);
        francePlanetContainer(anchor.group);
        hologramPlanetContainer(anchor.group);
        fresnelPulseContainer(anchor.group);
        pieChartContainer(anchor.group);
        LogoContainer(anchor.group);
        LinkButtonContainer(anchor.group);

        attachPointerEvents(renderer.domElement);

        (async () => {
            await mindarThree.start();
            renderer.setAnimationLoop(() => {
                animate(clock.getElapsedTime());
                renderer.render(scene, camera);
            });
        })();

    } else {

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 3;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        document.getElementById('links').style.display = 'flex';

        loadObjects(scene);
        colombiaPlanetContainer(scene);
        francePlanetContainer(scene);
        hologramPlanetContainer(scene);
        fresnelPulseContainer(scene);
        LogoContainer(scene);
        LinkButtonContainer(scene);
        LeyendaContainer(scene);
        pieChartContainer(scene);

        attachPointerEvents(renderer.domElement);

        (function devLoop() {
            requestAnimationFrame(devLoop);
            animate(clock.getElapsedTime());
            renderer.render(scene, camera);
        })();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    // ── OBJECT CONTAINERS ────────────────────────────────────────
    function loadObjects(container) {
        container.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sun = new THREE.DirectionalLight(0xffffff, 1.0);
        sun.position.set(5, 3, 5);
        container.add(sun);

        planet = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), planetMaterial);
        planet.scale.set(0.5, 0.5, 0.5);
        container.add(planet);

        loader.load('Models/Satelite_High.glb',
            (gltf) => {
                satellite = gltf.scene;
                satellite.scale.set(0.04, 0.04, 0.04);
                satellite.position.set(-0.64, 1, 0);
                satellite.rotation.set(20, 120, 0);
                container.add(satellite);
            },
            null,
            (e) => console.error(e)
        );
    }

    function colombiaPlanetContainer(container) {
        // FIX 3: was referencing waveSphere.raycast before waveSphere existed.
        //        Now correctly sets planetColombia.raycast.
        planetColombia = new THREE.Mesh(
            new THREE.SphereGeometry(1, 32, 32),
            colombiaMaterial
        );
        planetColombia.scale.set(0.501, 0.501, 0.501); // tiny offset to clear z-fight
        planetColombia.raycast = () => {};              // ← FIX 3
        container.add(planetColombia);
    }

    function francePlanetContainer(container) {
        // FIX 3: was referencing waveSphere.raycast before waveSphere existed.
        //        Now correctly sets planetFrance.raycast.
        planetFrance = new THREE.Mesh(
            new THREE.SphereGeometry(1, 32, 32),
            franceMaterial
        );
        planetFrance.scale.set(0.501, 0.501, 0.501); // tiny offset to clear z-fight
        planetFrance.raycast = () => {};              // ← FIX 3
        container.add(planetFrance);
    }

    function hologramPlanetContainer(container) {
        waveSphere = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), hologramMaterial);
        waveSphere.scale.set(0.52, 0.52, 0.52);
        waveSphere.raycast = () => {};
        container.add(waveSphere);
    }

    function fresnelPulseContainer(container) {
        fresnelPulseSphere = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), fresnelPulseMaterial);
        fresnelPulseSphere.scale.set(0.51, 0.51, 0.51);
        fresnelPulseSphere.raycast = () => {};
        container.add(fresnelPulseSphere);
    }

    function LogoContainer(container) {
        loader.load('Models/logo.glb',
            (gltf) => {
                logo = gltf.scene;
                logo.scale.set(0.1, 0.1, 0.1);
                logo.position.set(0, 1.7, 0);
                container.add(logo);
            },
            null,
            (e) => console.error(e)
        );
    }

    function LinkButtonContainer(container) {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 128;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = 'rgba(0,170,255,0.2)';
        ctx.beginPath(); ctx.roundRect(4, 4, 504, 120, 40); ctx.fill();

        ctx.strokeStyle = '#7dbf65'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.roundRect(4, 4, 504, 120, 90); ctx.stroke();

        ctx.fillStyle = '#7dbf65';
        ctx.font = '300 36px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('One Tap Away', 256, 64);

        linkButton = new THREE.Mesh(
            new THREE.PlaneGeometry(0.75, 0.1875),
            new THREE.MeshBasicMaterial({
                map: new THREE.CanvasTexture(canvas),
                transparent: true, depthWrite: false, side: THREE.DoubleSide,
            })
        );
        linkButton.position.set(0, 1, 0);
        container.add(linkButton);
    }

    function LeyendaContainer(container) {
        const ratio  = window.devicePixelRatio || 1;
        const canvas = document.createElement('canvas');
        canvas.width = 512 * ratio; canvas.height = 128 * ratio;
        const ctx = canvas.getContext('2d');
        ctx.scale(ratio, ratio);

        ctx.fillStyle = 'rgba(100,183,101,0.09)';
        ctx.beginPath(); ctx.roundRect(4, 14, 504, 95, 1); ctx.fill();

        ctx.fillStyle = '#7dbf65';
        ctx.font = '300 20px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('Hi!, I am Javier Ladino // Data-Design Engineer', 256, 64);

        leyenda = new THREE.Mesh(
            new THREE.PlaneGeometry(0.75, 0.1875),
            new THREE.MeshBasicMaterial({
                map: new THREE.CanvasTexture(canvas),
                transparent: true, depthWrite: false, side: THREE.DoubleSide,
            })
        );
        leyenda.position.set(0, 1.3, 0);
        leyenda.scale.set(2, 2, 2);
        container.add(leyenda);
    }

    // ── PIE CHART CONTAINER (with text labels) ───────────────────
    //
    // Architecture:
    //   pieChartGroup  (Three.Group, billboarded in animate)
    //     ├─ pieChartMesh   (the shader ring)
    //     └─ labelMesh[i]   (one canvas-text plane per bar)
    //
    // Text orientation: each label's local +X axis points TOWARD the
    // circle centre, so the text reads outward→inward.
    // In animate() we set each label's rotation.z = barWorldAngle + PI,
    // which flips the +X direction to point inward along the radial.
    //
    // To change a label: edit BAR_LABELS[i] at the top of the file.

    function makeLabelCanvas(text, hexColor) {
        const W = 300, H = 52;
        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');

        // sci-fi glow: draw text twice — blurred behind for glow, sharp on top
        ctx.clearRect(0, 0, W, H);
        ctx.font = 'bold 26px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.shadowColor  = hexColor;
        ctx.shadowBlur   = 12;
        ctx.fillStyle    = hexColor;
        ctx.fillText(text, W / 2, H / 2);   // glow pass

        ctx.shadowBlur   = 0;
        ctx.fillStyle    = '#ffffff';
        ctx.fillText(text, W / 2, H / 2);   // crisp pass on top

        return new THREE.CanvasTexture(canvas);
    }

    function pieChartContainer(container) {
        pieChartGroup = new THREE.Group();
        pieChartGroup.position.set(0, 0, 0.01);

        // ── ring mesh ──
        pieChartMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), pieChartMaterial);
        pieChartMesh.raycast = () => {};
        pieChartGroup.add(pieChartMesh);

        // ── one label per bar ──
        const numBars = pieChartMaterial.uniforms.uNumBars.value;

        for (let i = 0; i < numBars; i++) {
            const label = BAR_LABELS[i] ?? `Bar ${i}`;
            const col   = pieChartMaterial.uniforms[`uBarColor${i}`].value;
            const hex   = '#' + col.getHexString();

            const tex = makeLabelCanvas(label, hex);
            const mat = new THREE.MeshBasicMaterial({
                map:         tex,
                transparent: true,
                depthWrite:  false,
                side:        THREE.DoubleSide,
            });

            // Width ≈ radial span of bar, height ≈ a thin strip within bar arc
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.11), mat);
            mesh.raycast = () => {};
            pieChartGroup.add(mesh);
            labelMeshes.push(mesh);
        }

        container.add(pieChartGroup);
    }

    // ── ANIMATE ──────────────────────────────────────────────────
    function animate(elapsed) {

        planetMaterial.uniforms.uTime.value        = elapsed;
        colombiaMaterial.uniforms.uTime.value      = elapsed;   // FIX 3: was *= elapsed
        hologramMaterial.uniforms.uTime.value      = elapsed;
        fresnelPulseMaterial.uniforms.uTime.value  = elapsed * 0.8;
        pieChartMaterial.uniforms.uTime.value      = elapsed;

        if (planet && !isDragging && autorotate) {
            planet.rotation.y         += 0.003;
            if (planetColombia) planetColombia.rotation.y += 0.003;
            if(planetFrance) planetFrance.rotation.y += 0.003;
        }

        if (logo)      logo.rotation.y      = elapsed * 0.4;
        if (satellite) satellite.rotation.z = elapsed * 0.2;

        // ── Billboard: whole pie-chart group faces camera ─────────
        if (pieChartGroup) {
            pieChartGroup.quaternion.copy(camera.quaternion);

            // ── Update each label position + rotation ─────────────
            // The shader rotates bars by:  theta_shader = theta_world - elapsed * rotSpeed
            // So world angle of bar-i centre = i * sliceAngle + barAngle/2 + elapsed * rotSpeed
            const numBars    = pieChartMaterial.uniforms.uNumBars.value;
            const rotSpeed   = pieChartMaterial.uniforms.uRotationSpeed.value;
            const innerR     = pieChartMaterial.uniforms.uInnerRadius.value;
            const outerR     = pieChartMaterial.uniforms.uOuterRadius.value;
            const gapAngle   = pieChartMaterial.uniforms.uGapAngle.value;
            const TWO_PI     = Math.PI * 2;
            const sliceAngle = TWO_PI / numBars;
            const barAngle   = sliceAngle - gapAngle;

            for (let i = 0; i < labelMeshes.length; i++) {
                const barLen   = pieChartMaterial.uniforms[`uBarLength${i}`]?.value ?? 0.7;
                const barOuter = innerR + (outerR - innerR) * barLen;

                // radial midpoint of this bar
                const rMid = (innerR + barOuter) * 0.5;

                // world angle of bar-i angular centre (matching shader's rotation)
                const worldAngle = i * sliceAngle + barAngle * 0.5 + elapsed * rotSpeed;

                // position inside the group's XY plane
                labelMeshes[i].position.set(
                    rMid * Math.cos(worldAngle),
                    rMid * Math.sin(worldAngle),
                    0.001   // just in front of the ring mesh
                );

                // Rotate text so its +X axis (reading direction) points TOWARD centre.
                // +X at worldAngle points OUTWARD, so we add PI to flip it inward.
                labelMeshes[i].rotation.z = worldAngle + Math.PI;
            }
        }

        // Billboard standalone UI elements
        if (linkButton) linkButton.quaternion.copy(camera.quaternion);
        if (leyenda)    leyenda.quaternion.copy(camera.quaternion);
    }

</script>
